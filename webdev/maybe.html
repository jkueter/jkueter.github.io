<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circular Image</title>
  <style>
    .circle-border {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background-color: #5ce2e2;
      padding: 10px;
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .circle-border img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #525855;
      display: block;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <div class="circle-border">
    <img src="jkueter2.jpeg" alt="Profile Image" />
  </div>

</body>
</html>
