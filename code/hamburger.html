<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Nav with Dropdown</title>
  <link rel="stylesheet" href="hamstyle.css" />
</head>
<body>
  <nav class="navbar">
    <!-- Hidden checkbox + visible hamburger label -->
    <input type="checkbox" id="menu-toggle" class="nav-toggle" aria-label="Toggle menu">
    <label for="menu-toggle" class="menu-icon" aria-hidden="true">☰</label>

    <!-- Navigation links -->
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>

      <!-- Desktop dropdown (click-to-open) -->
      <li class="dropdown">
        <input type="checkbox" id="services-toggle" class="dropdown-toggle">
        <label for="services-toggle">Services ▾</label>
        <ul class="dropdown-content">
          <li><a href="#">Link 1</a></li>
          <li><a href="#">Link 2</a></li>
          <li><a href="#">Link 3</a></li>
        </ul>
      </li>

      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
</body>
</html>
